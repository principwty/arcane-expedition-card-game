<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>奧術遠征</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" class="app">
      <section id="startScreen" class="start-screen">
        <div class="brand">
          <img src="./assets/sigil.svg" alt="" class="sigil" />
          <div>
            <p class="eyebrow">1v1 牌組進化卡牌原型</p>
            <h1>奧術遠征</h1>
            <p class="intro">選擇召喚師，在 10-15 分鐘的奇幻對戰中推進遠征軌，從三張進化牌中抉擇，讓你的牌組在戰局內成長。</p>
          </div>
        </div>
        <div id="summonerGrid" class="summoner-grid"></div>
      </section>

      <section id="builderScreen" class="builder-screen hidden">
        <header class="topbar">
          <div>
            <p class="eyebrow">收藏與構築</p>
            <h2 id="builderTitle">星穹學派 預設牌組</h2>
          </div>
          <div class="topbar-actions">
            <button id="backToSummonersBtn" class="button secondary">返回召喚師</button>
            <button id="startCustomBtn" class="button primary">使用此牌組開局</button>
          </div>
        </header>

        <section class="builder-toolbar">
          <label>
            <span>牌組</span>
            <select id="deckSelect"></select>
          </label>
          <label>
            <span>名稱</span>
            <input id="deckNameInput" type="text" maxlength="32" />
          </label>
          <label>
            <span>任務</span>
            <select id="questSelect"></select>
          </label>
          <label>
            <span>搜尋</span>
            <input id="builderSearch" type="search" placeholder="卡名、文字、關鍵字" />
          </label>
          <label>
            <span>類型</span>
            <select id="builderType">
              <option value="all">全部</option>
              <option value="minion">召喚物</option>
              <option value="spell">法術</option>
              <option value="secret">秘儀</option>
              <option value="artifact">遺物</option>
            </select>
          </label>
          <label>
            <span>費用</span>
            <select id="builderCost">
              <option value="all">全部</option>
              <option value="0-1">0-1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5+">5+</option>
            </select>
          </label>
          <label>
            <span>打法</span>
            <select id="builderTag">
              <option value="all">全部</option>
            </select>
          </label>
        </section>

        <section class="builder-layout">
          <div class="card-pool-panel">
            <div class="builder-panel-heading">
              <h3>卡池</h3>
            </div>
            <div id="archetypeList" class="archetype-list"></div>
            <div id="cardPool" class="card-pool"></div>
          </div>
          <aside class="deck-panel">
            <div class="builder-panel-heading">
              <h3>牌組</h3>
              <div class="deck-actions">
                <button id="saveDeckBtn" class="button secondary">儲存</button>
                <button id="copyDeckBtn" class="button secondary">複製</button>
                <button id="deleteDeckBtn" class="button secondary">刪除</button>
                <button id="resetDeckBtn" class="button secondary">重設</button>
              </div>
            </div>
            <div id="deckSummary" class="deck-summary"></div>
            <div id="deckStatus" class="deck-status"></div>
            <div id="deckList" class="deck-list"></div>
          </aside>
        </section>
      </section>

      <section id="gameScreen" class="game-screen hidden">
        <header class="topbar">
          <div>
            <p class="eyebrow">奧術遠征</p>
            <h2 id="matchTitle">星穹學派 對 龍焰王庭</h2>
          </div>
          <div class="topbar-actions">
            <label class="speed-control">
              <span>動畫</span>
              <select id="animationSpeed">
                <option value="normal">正常</option>
                <option value="fast">快速</option>
                <option value="off">關閉</option>
              </select>
            </label>
            <label class="speed-control">
              <span>演出</span>
              <select id="animationDetail">
                <option value="compact">精簡</option>
                <option value="standard">標準</option>
                <option value="full">完整</option>
              </select>
            </label>
            <button id="deployBtn" class="button secondary">部署 1</button>
            <button id="simulateBtn" class="button secondary">模擬 50 場</button>
            <button id="newGameBtn" class="button secondary">新對局</button>
            <button id="endTurnBtn" class="button primary">結束回合</button>
          </div>
        </header>

        <section id="opponentArea" class="player-zone opponent"></section>
        <section class="battlefield">
          <div id="actionHint" class="action-hint">準備遠征</div>
          <div id="visualOverlay" class="visual-overlay" aria-hidden="true"></div>
          <div id="opponentArtifacts" class="side-slots"></div>
          <div id="opponentBoard" class="board-row"></div>
          <div id="playerBoard" class="board-row"></div>
          <div id="playerArtifacts" class="side-slots"></div>
        </section>
        <section id="playerArea" class="player-zone"></section>
        <section id="hand" class="hand"></section>

        <aside class="log-panel">
          <h3>觀測</h3>
          <div id="metrics" class="metrics"></div>
          <h3>平衡摘要</h3>
          <div id="balanceSummary" class="balance-summary">尚未模擬</div>
          <h3>戰況</h3>
          <div id="log" class="log"></div>
        </aside>
      </section>

      <div id="evolutionModal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-panel">
          <div class="modal-heading">
            <p class="eyebrow">遠征突破</p>
            <h2>選擇一張進化牌</h2>
          </div>
          <div id="evolutionChoices" class="evolution-choices"></div>
        </div>
      </div>

      <div id="resultModal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-panel result">
          <h2 id="resultTitle">勝利</h2>
          <p id="resultText"></p>
          <button id="resultNewGameBtn" class="button primary">再來一局</button>
        </div>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
